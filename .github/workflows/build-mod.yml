name: Build mod JAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests and build Still Wander
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p source/1.21.1 clean build --no-daemon --console=plain

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v7
        with:
          path: |
            source/1.21.1/build/libs/stillwander-neoforge-*.jar
            !source/1.21.1/build/libs/*-sources.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
